<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xtreme Adventure · Fichaje</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#f5f5f5;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px}.brand{text-align:center;margin:20px 0 28px}.brand h1{margin:0;font-size:34px}.brand p{color:#aaa}.card{background:#171d25;border:1px solid #2a3340;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.employee{padding:18px;border-radius:14px;background:#222a35;border:1px solid #303b49;color:white;font-size:16px;cursor:pointer}.employee:hover{border-color:#61dafb}.selected{border-color:#61dafb;background:#253442}.pin{display:flex;gap:8px;margin-top:14px}.pin input{flex:1;padding:14px;border-radius:10px;border:1px solid #394554;background:#0f141a;color:white;font-size:18px;text-align:center;letter-spacing:5px}.btn{padding:14px 18px;border:0;border-radius:11px;cursor:pointer;font-weight:bold;font-size:16px}.green{background:#22c55e;color:#07120a}.red{background:#ef4444;color:white}.blue{background:#3b82f6;color:white}.gray{background:#374151;color:white}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#111827;color:#ddd}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#11161d;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:24px;margin-top:5px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #2c3440;text-align:left}th{color:#aaa}.status{font-weight:bold}.on{color:#22c55e}.off{color:#aaa}.danger{color:#fca5a5}@media(max-width:600px){.stats{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="brand"><div style="font-size:48px">⚡</div><h1>XTREME ADVENTURE</h1><p>Control de fichaje</p></div>
<div id="employeeView" class="card"><h2>Fichaje de empleado</h2><p>Selecciona tu nombre:</p><div id="employees" class="grid"></div><div id="pinArea" class="hidden"><div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"><button class="btn blue" onclick="login()">Entrar</button></div><div id="loginMsg"></div></div><div id="clockArea" class="hidden"><div class="msg" id="welcome"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn green" onclick="clockIn()">🟢 FICHAR ENTRADA</button><button class="btn red" onclick="clockOut()">🔴 FICHAR SALIDA</button><button class="btn gray" onclick="logout()">Cerrar</button></div><div id="clockMsg"></div></div></div>
<div class="card"><div class="top"><h2 style="margin:0">👑 Administrador</h2><button class="btn gray" onclick="showAdmin()">Abrir panel</button></div><div id="admin" class="hidden"></div></div>
</div><script>
const employees=["Francis Anton Lopez","Pedro Martinez","Jose Fernandez","Kiara Bennett","Alejandro de la Vega","Canadela Garcia","Sergio Costa","Issac Moreno","Pedro Josue Almeida","Mateo Salazar"];
const defaultPins={"Francis Anton Lopez":"1001","Pedro Martinez":"1002","Jose Fernandez":"1003","Kiara Bennett":"1004","Alejandro de la Vega":"1005","Canadela Garcia":"1006","Sergio Costa":"1007","Issac Moreno":"1008","Pedro Josue Almeida":"1009","Mateo Salazar":"1010"};
const ADMIN_PIN="9999";let selected=null,logged=null;
const getLogs=()=>JSON.parse(localStorage.getItem('xtremeLogs')||'[]'); const saveLogs=x=>localStorage.setItem('xtremeLogs',JSON.stringify(x));
function renderEmployees(){document.getElementById('employees').innerHTML=employees.map(e=>`<button class="employee ${selected===e?'selected':''}" onclick="selectEmp('${e.replace(/'/g,"\\'")}')">👤 ${e}</button>`).join('')}
function selectEmp(e){selected=e;document.getElementById('pinArea').classList.remove('hidden');document.getElementById('clockArea').classList.add('hidden');document.getElementById('pin').value='';document.getElementById('loginMsg').innerHTML='';renderEmployees();document.getElementById('pin').focus()}
function login(){const p=document.getElementById('pin').value;if(p===defaultPins[selected]){logged=selected;document.getElementById('pinArea').classList.add('hidden');document.getElementById('clockArea').classList.remove('hidden');document.getElementById('welcome').textContent='Has iniciado sesión como '+logged;updateClockMsg()}else document.getElementById('loginMsg').innerHTML='<div class="msg danger">PIN incorrecto.</div>'}
function logout(){logged=null;document.getElementById('clockArea').classList.add('hidden');document.getElementById('pinArea').classList.add('hidden');selected=null;renderEmployees()}
function clockIn(){if(!logged)return;let logs=getLogs();if(logs.some(x=>x.employee===logged&&!x.out)){updateClockMsg('Ya tienes un fichaje abierto.');return}logs.push({id:Date.now(),employee:logged,in:new Date().toISOString(),out:null});saveLogs(logs);updateClockMsg('Entrada registrada correctamente.');}
function clockOut(){if(!logged)return;let logs=getLogs(),i=-1;for(let j=logs.length-1;j>=0;j--)if(logs[j].employee===logged&&!logs[j].out){i=j;break}if(i<0){updateClockMsg('No hay una entrada abierta.');return}logs[i].out=new Date().toISOString();saveLogs(logs);updateClockMsg('Salida registrada correctamente.');}
function updateClockMsg(t=''){const logs=getLogs(),open=logs.find(x=>x.employee===logged&&!x.out);document.getElementById('clockMsg').innerHTML='<div class="msg">'+(t|| (open?'🟢 Estás trabajando desde '+fmt(open.in):'⚪ No tienes un fichaje abierto.'))+'</div>'}
function fmt(iso){return new Date(iso).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}
function dur(a,b){let ms=new Date(b)-new Date(a);if(ms<0)ms=0;let m=Math.floor(ms/60000),h=Math.floor(m/60);m%=60;return h+'h '+String(m).padStart(2,'0')+'min'}
function totalFor(e){return getLogs().filter(x=>x.employee===e&&x.out).reduce((s,x)=>s+(new Date(x.out)-new Date(x.in)),0)}
function hm(ms){let m=Math.floor(ms/60000),h=Math.floor(m/60);m%=60;return h+'h '+String(m).padStart(2,'0')+'min'}
function showAdmin(){const pin=prompt('Introduce el PIN de administrador:');if(pin!==ADMIN_PIN){if(pin!==null)alert('PIN incorrecto');return}renderAdmin()}
function renderAdmin(){const a=document.getElementById('admin');a.classList.remove('hidden');let logs=getLogs().slice().reverse();let rows=logs.map(x=>`<tr><td>${x.employee}</td><td>${fmt(x.in)}</td><td>${x.out?fmt(x.out):'<span class="on">Trabajando</span>'}</td><td>${x.out?dur(x.in,x.out):'—'}</td><td><button class="btn gray" style="padding:7px 10px" onclick="delLog(${x.id})">Borrar</button></td></tr>`).join('');let summary=employees.map(e=>`<div class="stat"><span>${e}</span><b>${hm(totalFor(e))}</b></div>`).join('');a.innerHTML=`<div class="stats">${summary}</div><div style="display:flex;gap:8px;margin:18px 0;flex-wrap:wrap"><button class="btn blue" onclick="exportCSV()">📥 Exportar Excel/CSV</button><button class="btn red" onclick="clearAll()">Borrar todos</button></div><div style="overflow:auto"><table><thead><tr><th>Empleado</th><th>Entrada</th><th>Salida</th><th>Total</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">No hay fichajes.</td></tr>'}</tbody></table></div>`}
function delLog(id){if(!confirm('¿Borrar este fichaje?'))return;saveLogs(getLogs().filter(x=>x.id!==id));renderAdmin()}
function clearAll(){if(confirm('¿Seguro que quieres borrar TODOS los fichajes?')){saveLogs([]);renderAdmin()}}
function exportCSV(){let logs=getLogs();let csv='Empleado;Entrada;Salida;Horas totales\n'+logs.map(x=>[x.employee,fmt(x.in),x.out?fmt(x.out):'',x.out?dur(x.in,x.out):''].join(';')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fichajes_xtreme_adventure.csv';a.click();URL.revokeObjectURL(url)}
renderEmployees();
</script></body></html>
